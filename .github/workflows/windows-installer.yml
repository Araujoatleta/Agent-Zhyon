name: Windows installer

# Builds the Windows installer from a branch, as files to download from the run's Artifacts: no tag, no release,
# nothing published. windows.yml stays the release workflow (tags only). Runs when the Windows app changes, or by
# hand (Actions → Windows installer → Run workflow). The installer is not code-signed: SmartScreen asks once.

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-installer-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-installer-cargo-

      - name: Install dependencies
        run: npm ci

      # As in windows.yml: `npm run pack` builds coucou-hook, then the app and its installers, and copies them to
      # release/ under their shipping names.
      - name: Build and pack the installer
        id: pack
        shell: pwsh
        run: |
          npm run pack
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: Coucou-Windows-msi
          path: windows/release/Coucou-Windows-${{ steps.pack.outputs.version }}.msi
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: Coucou-Windows-setup
          path: windows/release/Coucou-Windows-${{ steps.pack.outputs.version }}-setup.exe
          retention-days: 14

      # The bare binaries too: coucou.exe finds coucou-hook.exe next to it, so the pair runs with working Claude
      # Code hooks and no installer.
      - uses: actions/upload-artifact@v7
        with:
          name: Coucou-Windows-portable
          path: |
            windows/target/release/coucou.exe
            windows/target/release/coucou-hook.exe
          retention-days: 14
