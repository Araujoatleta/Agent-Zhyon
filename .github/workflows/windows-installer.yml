name: Windows installer

# Builds the Windows installer from a branch, as files to download from the run's Artifacts: no tag, no release,
# nothing published. windows.yml stays the release workflow (tags only). Runs when the Windows app changes, or by
# hand (Actions → Windows installer → Run workflow). The installer is not code-signed: SmartScreen asks once.

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-installer-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-installer-cargo-

      - name: Install dependencies
        run: npm ci

      # As in windows.yml: `npm run pack` builds coucou-hook, then the app and its installers, and copies them to
      # release/ under their shipping names.
      - name: Build and pack the installer
        id: pack
        shell: pwsh
        run: |
          npm run pack
          npm run verify:artifacts
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: Coucou-Windows-msi-unsigned
          path: |
            windows/release/Coucou-Windows-${{ steps.pack.outputs.version }}.msi
            windows/release/SHA256SUMS.txt
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: Coucou-Windows-setup-unsigned
          path: |
            windows/release/Coucou-Windows-${{ steps.pack.outputs.version }}-setup.exe
            windows/release/SHA256SUMS.txt
          retention-days: 14

      # Portable app, relay and edge worker. The edge worker is not auto-started
      # in portable mode; pair/configure it before enabling logon startup.
      - uses: actions/upload-artifact@v7
        with:
          name: Coucou-Windows-portable-unsigned
          path: |
            windows/release/Coucou-Windows-${{ steps.pack.outputs.version }}-portable/Coucou.exe
            windows/release/Coucou-Windows-${{ steps.pack.outputs.version }}-portable/coucou-hook.exe
            windows/release/Coucou-Windows-${{ steps.pack.outputs.version }}-portable/coucou-edge-worker.exe
            windows/release/SHA256SUMS.txt
          retention-days: 14
